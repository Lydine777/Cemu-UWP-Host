name: Build Cemu UWP

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: nuget/setup-nuget@v2

    - name: Restore NuGet packages
      run: nuget restore Cemu-UWP-Host.sln
      # 注意：如果项目根目录没有 .sln 文件，这里会报错。你需要去仓库 Code 页面看看主文件名是什么。

    - name: Build UWP app
      run: msbuild Cemu-UWP-Host.sln /p:Configuration=Release /p:Platform=x64 /m

    - name: Upload MSIX/AppX artifact
      uses: actions/upload-artifact@v4
      with:
        name: Cemu-UWP-Package
        path: |
          **/AppPackages/
          **/bin/x64/Release/
          **/*.msix
          **/*.appx
