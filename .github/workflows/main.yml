name: Build Cemu UWP

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: nuget/setup-nuget@v2

    - name: Restore NuGet packages
      run: nuget restore Cemu-UWP-Host.slnx

    - name: Build UWP app
      run: msbuild Cemu-UWP-Host.slnx /p:Configuration=Release /p:Platform=x64 /p:AppxPackageSigningEnabled=false /m

    - name: Upload MSIX/AppX artifact
      uses: actions/upload-artifact@v4
      with:
        name: Cemu-UWP-Package
        path: |
          **/AppPackages/
          **/*.msix
          **/*.appx
